allowBuilds:
  '@swc/core': false
  core-js: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@repodog/cli-cut'
  - '@repodog/cli-new'
  - '@repodog/cli-postinstall'
  - '@repodog/cli-publish'
  - '@repodog/cli-setup'
  - '@repodog/cli-utils'
  - '@repodog/cli'
  - '@repodog/commitlint-config'
  - '@repodog/eslint-config-jest'
  - '@repodog/eslint-config'
  - '@repodog/jest-config'
  - '@repodog/markdownlint-config'
  - '@repodog/prettier-config'
  - '@repodog/rollup-config'
  - '@repodog/swc-config'
  - '@repodog/syncpack-config'
  - '@repodog/ts-config'
  - 'cts-types'

overrides:
  'brace-expansion@<1.1.16': '^1.1.16'
  'brace-expansion@>=3.0.0 <5.0.7': '>=5.0.7'
  'fast-uri@>=3.0.0 <=3.1.3': '>=3.1.4'
  'markdown-it@<=14.1.1': '>=14.2.0'
  'js-yaml@<=4.1.1': '^4.2.0'
  'js-yaml@>=5.0.0 <=5.2.1': '>=5.2.2'
